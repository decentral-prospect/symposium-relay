name: Release

on:
  push:
    tags:
      - "*.*.*"

# A tag can produce at most one release build. There is intentionally no
# workflow_dispatch entry: official binaries are built only from pushed tags.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish Linux amd64
    environment: release
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      ARTIFACT: symposium-server-linux-amd64
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: amd64
      GOTOOLCHAIN: local

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use SemVer, for example 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi

      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require source from main
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test tagged source
        run: |
          go mod verify
          go test -mod=readonly -count=1 -timeout=10m ./...

      - name: Build release binary
        shell: bash
        run: |
          mkdir -p dist
          go build \
            -mod=readonly \
            -trimpath \
            -buildvcs=true \
            -ldflags="-s -w -X main.serverVersion=${GITHUB_REF_NAME}" \
            -o "dist/${ARTIFACT}" \
            .
          build_info="$(go version -m "dist/${ARTIFACT}")"
          grep -Fq "vcs.revision=${GITHUB_SHA}" <<<"$build_info"
          grep -Fq 'vcs.modified=false' <<<"$build_info"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/${{ env.ARTIFACT }}
          format: cyclonedx-json
          output-file: dist/${{ env.ARTIFACT }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Verify binary and create checksums
        shell: bash
        run: |
          file "dist/${ARTIFACT}"
          file "dist/${ARTIFACT}" | grep -q "ELF 64-bit.*x86-64"

          test -s "dist/${ARTIFACT}.cdx.json"

          cd dist

          sha256sum \
            "$ARTIFACT" \
            "${ARTIFACT}.cdx.json" \
            > SHA256SUMS

          sha256sum --check SHA256SUMS

      - name: Attest GitHub-built binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.ARTIFACT }}

      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.ARTIFACT }}
          sbom-path: dist/${{ env.ARTIFACT }}.cdx.json

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "SymposiumRelay ${GITHUB_REF_NAME}" \
            --draft

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${ARTIFACT}#Linux amd64" \
            "dist/${ARTIFACT}.cdx.json#CycloneDX SBOM" \
            "dist/SHA256SUMS#SHA-256 checksums"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false \
              --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" \
              --draft=false
          fi
